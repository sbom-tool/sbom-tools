name: Tag Integrity Check

# Detects tag poisoning and release tampering attacks.
# See: https://www.aquasec.com/blog/tag-poisoning-attack (Trivy incident)

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch: # Allow manual trigger

permissions: read-all

jobs:
  check-tags:
    name: Verify release tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify all release tags are on main
        shell: bash
        run: |
          set -euo pipefail
          FAILED=0
          CHECKED=0
          SUSPECT_TAGS=""

          for tag in $(git tag -l 'v*'); do
            CHECKED=$((CHECKED + 1))
            TAG_SHA=$(git rev-list -n1 "$tag")

            # Check 1: Tag must point to a commit on main
            if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
              echo "::error::Tag $tag ($TAG_SHA) is NOT an ancestor of origin/main!"
              SUSPECT_TAGS="${SUSPECT_TAGS} $tag"
              FAILED=1
              continue
            fi

            # Check 2: If it's a signed tag, verify the signature
            if git cat-file -t "$tag" 2>/dev/null | grep -q "tag"; then
              if ! git tag -v "$tag" 2>/dev/null; then
                echo "::warning::Tag $tag has a signature that could not be verified"
              fi
            fi
          done

          echo "Checked ${CHECKED} release tags"

          if [[ $FAILED -ne 0 ]]; then
            echo "::error::SUSPECT TAGS:${SUSPECT_TAGS}"
            echo "::error::One or more release tags point to commits NOT on main."
            echo "::error::This may indicate a tag poisoning attack."
            echo "::error::See: https://www.aquasec.com/blog/tag-poisoning-attack"
            exit 1
          fi

          echo "All ${CHECKED} release tags verified on main"

      - name: Check for force-pushed tags (compare with releases)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FAILED=0

          # For each GitHub Release, verify the tag SHA matches what GitHub recorded
          gh api repos/${{ github.repository }}/releases --paginate --jq '.[] | "\(.tag_name) \(.target_commitish)"' | \
          while read -r TAG_NAME TARGET_SHA; do
            # target_commitish may be a branch name or SHA; skip branch names
            if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              continue
            fi

            LOCAL_SHA=$(git rev-list -n1 "$TAG_NAME" 2>/dev/null || echo "MISSING")
            if [[ "$LOCAL_SHA" == "MISSING" ]]; then
              echo "::error::Release tag $TAG_NAME exists in GitHub Releases but not in git!"
              FAILED=1
            elif [[ "$LOCAL_SHA" != "$TARGET_SHA" ]]; then
              echo "::error::Tag $TAG_NAME SHA mismatch! Git: $LOCAL_SHA, Release: $TARGET_SHA"
              echo "::error::This tag may have been force-pushed after the release was created."
              FAILED=1
            fi
          done

          if [[ $FAILED -ne 0 ]]; then
            exit 1
          fi

          echo "All release tag SHAs match GitHub Release records"

  check-release-assets:
    name: Verify release asset integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify release asset checksums against signed manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED=0
          SKIPPED=0
          FAILED=0
          MANIFEST=release-manifest.sha256
          BUNDLE=release-manifest.sha256.bundle

          asset_url() {
            local name=$1 url
            if url=$(jq -nr --arg name "${name}" '
              input.assets | if type != "array" then error("invalid release assets") else . end
              | [.[] | select(.name == $name) | .browser_download_url]
              | if length == 0 then empty
                elif length == 1 and (.[0] | type == "string"
                  and test("\\S") and (test("[\r\n]") | not)) then .[0]
                else error("invalid asset download metadata")
                end
            ' <<< "${RELEASE_JSON}" 2>/dev/null); then
              printf '%s\n' "${url}"
            else
              echo "::error::Release ${TAG}: asset ${name} URL lookup failed (jq exit $?)" >&2
              return 1
            fi
          }

          download_asset() {
            local name=$1 url=$2 http_status curl_status=0
            # Report only status codes. Curl diagnostics can include download URLs.
            http_status=$(curl --fail --silent --location --globoff \
              --output "${RELEASE_DIR}/${name}" --write-out '%{http_code}' -- "${url}" 2>/dev/null) || curl_status=$?
            if [[ ${curl_status} -eq 0 && ${http_status} == 2[0-9][0-9] ]]; then
              return 0
            fi
            echo "::error::Release ${TAG}: asset ${name} download failed (curl exit ${curl_status}, HTTP ${http_status:-000})"
            return 1
          }

          verify_checksums() {
            local expected path name url actual found=0 failed=0
            # Manifest lines contain a SHA-256 hash followed by the original asset path.
            while read -r expected path || [[ -n "${expected}${path}" ]]; do
              if [[ -z "${expected}" || "${expected}" == \#* ]]; then
                continue
              fi
              found=1
              if [[ ! "${expected}" =~ ^[[:xdigit:]]{64}$ || -z "${path}" ]]; then
                echo "::error::Release ${TAG}: asset ${MANIFEST} contains a malformed checksum entry"
                failed=1
                continue
              fi
              name=$(basename -- "${path}")
              if ! url=$(asset_url "${name}"); then
                failed=1
              elif [[ -z "${url}" ]]; then
                echo "::error::Release ${TAG}: asset ${name} is listed in the manifest but missing from the release"
                failed=1
              elif ! download_asset "${name}" "${url}"; then
                failed=1
              elif ! actual=$(sha256sum < "${RELEASE_DIR}/${name}"); then
                echo "::error::Release ${TAG}: asset ${name} could not be hashed"
                failed=1
              elif [[ "${actual%% *}" != "${expected}" ]]; then
                echo "::error::Release ${TAG}: asset ${name} checksum mismatch (expected ${expected}, got ${actual%% *})"
                failed=1
              fi
            done < "${RELEASE_DIR}/${MANIFEST}"

            if [[ ${found} -eq 0 ]]; then
              echo "::error::Release ${TAG}: asset ${MANIFEST} contains no checksums"
              return 1
            fi
            return "${failed}"
          }

          RELEASES=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '.[] | [.id, .tag_name] | @tsv' 2>/dev/null) || {
            echo "::error::Could not list releases for ${GITHUB_REPOSITORY} (gh exit $?)"
            exit 1
          }

          while IFS=$'\t' read -r RELEASE_ID TAG; do
            [[ -n "${RELEASE_ID}" ]] || continue

            RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" 2>/dev/null) || {
              echo "::error::Release ${TAG}: asset metadata lookup failed (gh exit $?)"
              FAILED=$((FAILED + 1))
              continue
            }
            if ! MANIFEST_URL=$(asset_url "${MANIFEST}"); then
              FAILED=$((FAILED + 1))
              continue
            fi
            if [[ -z "${MANIFEST_URL}" ]]; then
              echo "::notice::Release ${TAG} has no ${MANIFEST} — skipping (pre-manifest release)"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            RELEASE_DIR="release-${RELEASE_ID}"
            if ! mkdir -p "${RELEASE_DIR}"; then
              echo "::error::Release ${TAG}: could not create the asset download directory"
              FAILED=$((FAILED + 1))
              continue
            fi
            if ! download_asset "${MANIFEST}" "${MANIFEST_URL}" ||
              ! BUNDLE_URL=$(asset_url "${BUNDLE}"); then
              FAILED=$((FAILED + 1))
              continue
            fi

            if [[ -n "${BUNDLE_URL}" ]]; then
              if ! download_asset "${BUNDLE}" "${BUNDLE_URL}"; then
                FAILED=$((FAILED + 1))
                continue
              fi
              if cosign verify-blob \
                --bundle "${RELEASE_DIR}/${BUNDLE}" \
                --certificate-identity-regexp "https://github.com/sbom-tool/sbom-tools/" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                "${RELEASE_DIR}/${MANIFEST}" 2>/dev/null; then
                echo "Release ${TAG}: manifest signature verified"
              else
                echo "::error::Release ${TAG}: asset ${MANIFEST} signature verification failed (cosign exit $?)"
                FAILED=$((FAILED + 1))
                continue
              fi
            else
              echo "::warning::Release ${TAG}: manifest exists but has no Sigstore bundle"
            fi

            if verify_checksums; then
              VERIFIED=$((VERIFIED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          done <<< "${RELEASES}"

          echo "Release asset verification: ${VERIFIED} verified, ${SKIPPED} skipped (pre-manifest), ${FAILED} failed"
          if [[ ${FAILED} -ne 0 ]]; then
            exit 1
          fi
