name: 'sbom-tools'
description: 'Install and run sbom-tools for SBOM diff, validation, and quality scoring'
author: 'sbom-tool'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  version:
    description: 'sbom-tools version to install (e.g. "0.1.14", "latest")'
    required: false
    default: 'latest'
  command:
    description: 'Command to run: diff, validate, quality, view, query'
    required: true
  args:
    description: 'Arguments to pass to the command'
    required: false
    default: ''
  fail-on-vuln:
    description: 'Exit non-zero if new vulnerabilities are introduced (diff only)'
    required: false
    default: 'false'
  fail-on-change:
    description: 'Exit non-zero if any SBOM changes are detected (diff only)'
    required: false
    default: 'false'
  fail-on-vex-gap:
    description: 'Exit non-zero if vulnerabilities lack VEX statements (diff only)'
    required: false
    default: 'false'
  enrich-vulns:
    description: 'Enrich SBOM with vulnerability data from OSV/KEV'
    required: false
    default: 'false'
  output-format:
    description: 'Output format: json, sarif, markdown, summary, table, csv, html'
    required: false
    default: ''
  output-file:
    description: 'Write output to this file path'
    required: false
    default: ''
  min-score:
    description: 'Minimum quality score threshold (quality command only)'
    required: false
    default: ''
  standard:
    description: 'Compliance standard(s) to check (validate command): ntia, cra, fda, ssdf, eo14028'
    required: false
    default: ''
  profile:
    description: 'Quality scoring profile: minimal, standard, security, comprehensive, cra'
    required: false
    default: ''
  working-directory:
    description: 'Working directory for running the command'
    required: false
    default: '.'

outputs:
  exit-code:
    description: 'Exit code from sbom-tools (0=success, 1=changes, 2=vulns, 4=vex-gaps)'
    value: ${{ steps.run.outputs.exit-code }}
  version:
    description: 'Installed sbom-tools version'
    value: ${{ steps.install.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Detect platform
      id: platform
      shell: bash
      run: |
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)   target="x86_64-unknown-linux-gnu" ; ext="tar.gz" ;;
          Linux-ARM64)  target="aarch64-unknown-linux-gnu" ; ext="tar.gz" ;;
          macOS-X64)    target="x86_64-apple-darwin" ; ext="tar.gz" ;;
          macOS-ARM64)  target="aarch64-apple-darwin" ; ext="tar.gz" ;;
          Windows-X64)  target="x86_64-pc-windows-msvc" ; ext="zip" ;;
          *)
            echo "::error::Unsupported platform: ${{ runner.os }}-${{ runner.arch }}"
            exit 1
            ;;
        esac
        echo "target=$target" >> "$GITHUB_OUTPUT"
        echo "ext=$ext" >> "$GITHUB_OUTPUT"

    - name: Resolve version
      id: version
      shell: bash
      run: |
        version="${{ inputs.version }}"
        if [ "$version" = "latest" ]; then
          version=$(gh release view --repo sbom-tool/sbom-tools --json tagName -q '.tagName' | sed 's/^v//')
          if [ -z "$version" ]; then
            echo "::error::Failed to resolve latest version"
            exit 1
          fi
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Install sbom-tools
      id: install
      shell: bash
      run: |
        version="${{ steps.version.outputs.version }}"
        target="${{ steps.platform.outputs.target }}"
        ext="${{ steps.platform.outputs.ext }}"
        archive="sbom-tools-${target}.${ext}"
        url="https://github.com/sbom-tool/sbom-tools/releases/download/v${version}/${archive}"

        echo "::group::Downloading sbom-tools v${version} for ${target}"
        curl -fsSL -o "$archive" "$url"
        curl -fsSL -o "${archive}.sha256" "${url}.sha256"

        # Verify checksum
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c "${archive}.sha256"
        elif command -v shasum >/dev/null 2>&1; then
          shasum -a 256 -c "${archive}.sha256"
        else
          echo "::warning::No sha256 tool found, skipping checksum verification"
        fi

        # Extract
        if [ "$ext" = "tar.gz" ]; then
          tar xzf "$archive"
        else
          unzip -q "$archive"
        fi

        # Install to path
        install_dir="${RUNNER_TOOL_CACHE:-/tmp}/sbom-tools/${version}"
        mkdir -p "$install_dir"
        if [ "${{ runner.os }}" = "Windows" ]; then
          mv sbom-tools.exe "$install_dir/"
        else
          mv sbom-tools "$install_dir/"
          chmod +x "$install_dir/sbom-tools"
        fi
        echo "$install_dir" >> "$GITHUB_PATH"
        echo "::endgroup::"

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Installed sbom-tools v${version}"

    - name: Run sbom-tools
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Build command
        cmd="sbom-tools ${{ inputs.command }}"

        # Add flags for diff command
        if [ "${{ inputs.fail-on-vuln }}" = "true" ]; then
          cmd="$cmd --fail-on-vuln"
        fi
        if [ "${{ inputs.fail-on-change }}" = "true" ]; then
          cmd="$cmd --fail-on-change"
        fi
        if [ "${{ inputs.fail-on-vex-gap }}" = "true" ]; then
          cmd="$cmd --fail-on-vex-gap"
        fi
        if [ "${{ inputs.enrich-vulns }}" = "true" ]; then
          cmd="$cmd --enrich-vulns"
        fi

        # Output format
        if [ -n "${{ inputs.output-format }}" ]; then
          cmd="$cmd -o ${{ inputs.output-format }}"
        fi
        if [ -n "${{ inputs.output-file }}" ]; then
          cmd="$cmd -O ${{ inputs.output-file }}"
        fi

        # Quality/validate options
        if [ -n "${{ inputs.min-score }}" ]; then
          cmd="$cmd --min-score ${{ inputs.min-score }}"
        fi
        if [ -n "${{ inputs.standard }}" ]; then
          cmd="$cmd --standard ${{ inputs.standard }}"
        fi
        if [ -n "${{ inputs.profile }}" ]; then
          cmd="$cmd --profile ${{ inputs.profile }}"
        fi

        # Additional args
        if [ -n "${{ inputs.args }}" ]; then
          cmd="$cmd ${{ inputs.args }}"
        fi

        echo "::group::Running: $cmd"
        set +e
        eval "$cmd"
        exit_code=$?
        set -e
        echo "::endgroup::"

        echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"

        # Map exit codes to annotations
        case $exit_code in
          0) echo "sbom-tools completed successfully" ;;
          1) echo "::warning::SBOM changes detected (exit code 1)" ;;
          2) echo "::error::New vulnerabilities introduced (exit code 2)" ;;
          4) echo "::error::VEX coverage gaps found (exit code 4)" ;;
          *) echo "::error::sbom-tools failed with exit code $exit_code" ; exit $exit_code ;;
        esac
