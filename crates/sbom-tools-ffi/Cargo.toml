[package]
name = "sbom-tools-ffi"
version = "0.1.17"
edition = "2024"
rust-version = "1.88"
description = "C ABI bindings for sbom-tools (Go, Swift, Python consumers)"
license = "MIT"

[lib]
name = "sbom_tools_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# The C ABI only touches model/parsers/diff/quality (see ../../src/ffi.rs), so
# opt out of the default cli/tui/enrichment stack to keep the static/cdylib lean
# (no ratatui, crossterm, clap_complete, or reqwest/rustls linked in).
sbom-tools = { path = "../..", default-features = false, features = ["ffi"] }
