# cbindgen config for the sbom-tools C ABI header.
#
# The exported symbols live in `../../src/ffi.rs` (the root `sbom-tools` crate,
# behind the `ffi` feature); this crate is a thin cdylib/staticlib re-export.
# Generate with:
#
#   cbindgen --config crates/sbom-tools-ffi/cbindgen.toml \
#            --crate sbom-tools \
#            --output bindings/swift/Sources/CSbomTools/include/sbom_tools.h
#
# The header is committed so offline Go/Swift consumers build without cbindgen;
# CI regenerates it and fails on drift (.github/workflows/bindings.yml).

language = "C"
include_guard = "SBOM_TOOLS_H"
pragma_once = false
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "type"
sys_includes = ["stdint.h"]
no_includes = true
# Stable banner so regeneration stays byte-deterministic across cbindgen runs.
header = """
/*
 * @file sbom_tools.h
 * @brief C ABI for sbom-tools — SBOM parsing, diffing, and quality scoring.
 *
 * GENERATED by cbindgen from src/ffi.rs — DO NOT EDIT BY HAND.
 * Regenerate via `cbindgen --config crates/sbom-tools-ffi/cbindgen.toml`.
 *
 * Every SbomToolsStringResult MUST be freed exactly once via
 * sbom_tools_string_result_free(). Reuse after free is undefined behavior.
 */"""

[parse]
# Only the root crate's `ffi` module is in scope; do not pull dependency types.
parse_deps = false

[export]
# Restrict output to the ABI surface — without this cbindgen also emits every
# top-level `pub const` in the crate (DEFAULT_*, exit codes, TUI sizing, ...).
item_types = ["enums", "structs", "functions"]
include = ["SbomToolsStringResult", "SbomToolsErrorCode", "SbomToolsScoringProfile"]

[enum]
# Keep variants as a real C enum (Swift imports them with `.rawValue`).
prefix_with_name = false
rename_variants = "QualifiedScreamingSnakeCase"
